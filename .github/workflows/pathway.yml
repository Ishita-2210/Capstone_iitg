name: Pathway integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pathway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATHWAY_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest -r requirements-pathway.txt
      - run: python -c "import pathway; print(pathway.__version__)"
      - run: python -m pytest -q tests/integration
